<!DOCTYPE html>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
            text-align: center;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
        }
        button {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            background: #0d47a1;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .forgot {
            color: #0d47a1;
            cursor: pointer;
            margin-top: 10px;
        }
        /* Modal */
        #resetModal {
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            background:rgba(0,0,0,0.5);
            justify-content:center;
            align-items:center;
        }
        #resetModal .modal-box {
            background:white;
            padding:20px;
            width:280px;
            border-radius:10px;
            text-align:center;
        }
    </style>
</head>

<body>

    <h2>Coach App - Acceso</h2>

    <div class="box">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Contraseña">

        <button onclick="login()">Entrar</button>
        <button style="background:#2e7d32" onclick="register()">Crear cuenta</button>

        <p class="forgot" onclick="mostrarReset()">¿Has olvidado tu contraseña?</p>
    </div>

    <!-- Modal para recuperar contraseña -->
    <div id="resetModal">
        <div class="modal-box">
            <h3>Recuperar contraseña</h3>
            <input id="emailReset" type="email" placeholder="Introduce tu email">
            <button onclick="resetPassword()">Enviar correo</button>
            <button onclick="cerrarReset()" style="background:#777;">Cerrar</button>
        </div>
    </div>

    <script src="auth.js"></script>

</body>
</html>
